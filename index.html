<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杂货铺MSL入口</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 120px; /* 给播放器留空间 */
            background: linear-gradient(45deg, #ff0000, #ff9900, #ffff00, #00ff00, #00ffff, #0000ff, #9900ff, #ff00ff);
            background-size: 400% 400%;
            animation: flow 15s ease infinite;
            font-family: "Microsoft Yahei", sans-serif;
        }
        @keyframes flow {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        /* 修复文字显示模糊 */
        .notice {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            background: #ff0000;
            padding: 15px 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .time-container {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }
        .beijing-time {
            font-size: 26px;
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .run-duration {
            font-size: 24px;
            color: #000;
            font-weight: bold;
        }
        .kuaishou-id {
            font-size: 22px;
            color: #000;
            margin: 10px 0;
        }
        .thanks-text {
            font-size: 18px;
            color: #000;
            margin-bottom: 20px;
        }
        .jump-btn {
            padding: 15px 30px;
            font-size: 20px;
            color: #fff;
            background: #000;
            border: 2px solid #fff;
            border-radius: 10px;
            margin: 8px 0;
            width: 100%;
            max-width: 300px;
            cursor: pointer;
        }
        .police-text {
            font-size: 16px;
            color: #ff0000;
            font-weight: bold;
            margin: 15px 0;
        }
        .footer-info {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #000;
        }
        /* 播放器适配AppsGeyser */
        #xf-MusicPlayer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            max-width: 100%;
            z-index: 999;
        }
    </style>
    <!-- 强制加载图标库（解决AppsGeyser资源缺失） -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/iconfont/1.0.0/iconfont.min.css">
</head>
<body>
    <div class="notice">注意事项：如果打不开请使用浏览器打开</div>

    <div class="time-container">
        <div class="beijing-time" id="beijingTime">加载中...</div>
        <div class="run-duration" id="runDuration">服务器已运行：00天00时00分00秒</div>
    </div>

    <div class="kuaishou-id">唯一快手号: LEWCNM123</div>
    <div class="thanks-text">感谢你的使用</div>

    <button class="jump-btn" onclick="window.location.href='http://mslyyds1.734km.com/'">杂货店msl</button>
    <button class="jump-btn" onclick="window.location.href='https://ksmsl.449cf.com/'">杂货店msl2</button>

    <div class="police-text">公安机关已接入🚔</div>

    <div class="footer-info">
        <div>Copyright © 2023-2025 杂货店 All Rights Reserved.</div>
        <div style="color: #0099ff; text-decoration: underline; margin-top: 3px;">晋ICP备2025065813号</div>
    </div>

    <!-- 音乐播放器 -->
    <div id="xf-MusicPlayer" 
         data-cdnName="https://player.xfyun.club/js"
         data-bottomHeight="3"
         data-fadeOutAutoplay
         data-memory="1" 
         data-random="true">
    </div>

    <script>
        // 修复时间功能（适配AppsGeyser的时间环境）
        const fixedStartTime = new Date(2025, 10, 10, 0, 0, 0).getTime(); // 11月10日（早于当前时间）
        const oneYearMs = 1000 * 60 * 60 * 24 * 365;

        function formatBeijingTime() {
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        function formatCodeRunDuration() {
            const currentTime = new Date().getTime();
            let durationMs = currentTime - fixedStartTime;
            if (durationMs < 0) durationMs = 0;

            const years = Math.floor(durationMs / oneYearMs);
            durationMs %= oneYearMs;
            const days = Math.floor(durationMs / (1000*60*60*24));
            const hours = Math.floor(durationMs % (1000*60*60*24) / (1000*60*60));
            const minutes = Math.floor(durationMs % (1000*60*60) / (1000*60));
            const seconds = Math.floor(durationMs % (1000*60) / 1000);

            const pad = (n) => n.toString().padStart(2, '0');
            return years > 0 ? 
                `服务器已运行：${pad(years)}年${pad(days)}天${pad(hours)}时${pad(minutes)}分${pad(seconds)}秒` : 
                `服务器已运行：${pad(days)}天${pad(hours)}时${pad(minutes)}分${pad(seconds)}秒`;
        }

        // 强制每秒更新（解决AppsGeyser定时器延迟）
        function updateTime() {
            document.getElementById("beijingTime").textContent = formatBeijingTime();
            document.getElementById("runDuration").textContent = formatCodeRunDuration();
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>

    <!-- 强制加载播放器脚本（解决AppsGeyser资源阻塞） -->
    <script src="https://player.xfyun.club/js/xf-MusicPlayer/js/xf-MusicPlayer.min.js" onload="console.log('播放器加载完成')" onerror="alert('播放器加载失败，请检查网络')"></script>
</body>
</html>
